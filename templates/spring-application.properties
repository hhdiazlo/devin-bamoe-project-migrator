# Spring Boot target application.properties template for the BAMOE migrator.
# Source: SPRING-RULES-FOR-MIGRATOR.md section 3 (tutorial-12-spring).
# Status: Confirmed-by-build on H2 (PostgreSQL mode) only. PostgreSQL = Untested.
#
# FORMAT RULE: a .properties file has no inline comments. Everything after '=' is the value, so
# 'spring.flyway.enabled=false   # note' is NOT 'false'. Keep every comment on its own line.

server.port=8080

# H2 in PostgreSQL mode for local testing (Confirmed-by-build)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.username=sa
spring.datasource.password=

kogito.service.url=${KOGITO_SERVICE_URL:http://localhost:${server.port}}
# Untested whether the next two are needed (kept from the Quarkus v9 samples; the tutorial-12 app ran with them present)
kogito.jobs-service.url=${KOGITO_JOBS_SERVICE_URL:http://localhost:${server.port}}
kogito.data-index.url=${KOGITO_DATA_INDEX_URL:http://localhost:${server.port}}

kogito.persistence.type=jdbc
kogito.persistence.optimistic.lock=true
kogito.transactionEnabled=true
kogito.processes.transactionEnabled=true
kogito.usertasks.transactionEnabled=true

kie.flyway.enabled=true

# REQUIRED (Confirmed-by-build): Boot's own Flyway must stay off, else
# FlywayException: Found non-empty schema(s) "PUBLIC" but no schema history table.
spring.flyway.enabled=false

# REQUIRED on embedded DBs (Confirmed-by-build): Boot defaults ddl-auto to create-drop on H2 and re-creates the
# Kogito tables from JPA entities after KIE Flyway ran (job_details.recipient becomes VARCHAR(255) -> "Value too long").
spring.jpa.hibernate.ddl-auto=none

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Quarkus -> Spring key translation (Confirmed-by-build that the app runs without any quarkus.* key):
#   quarkus.http.port                                  -> server.port
#   quarkus.datasource.jdbc.url/username/password      -> spring.datasource.url/username/password
#   quarkus.hibernate-orm.database.generation=none     -> spring.jpa.hibernate.ddl-auto=none
#   dropped: quarkus.datasource.db-kind, *.enable-metrics, *.devservices.*, quarkus.hibernate-orm.validate-in-dev-mode,
#            *.log.sql, *.sql-load-script, %dev.quarkus.swagger-ui.*, %dev.quarkus.kogito.data-index.graphql.ui.*,
#            %dev.bamoe.devui.*
#   kogito.* and kie.flyway.* keys are unchanged.
# Profiles: '%dev.' / '%prod.' prefixes are Quarkus-only. Spring uses application-<profile>.properties or
# spring.config.activate.on-profile (Untested).

# PostgreSQL (Untested - no PostgreSQL was available). 'stringtype=unspecified' is taken from the reference
# service's comment (jobs 'recipient' is JSONB); production: kie.flyway.enabled=false and apply the db-utils DDL.
# spring.datasource.url=jdbc:postgresql://localhost:5432/__DB_NAME__?stringtype=unspecified
# spring.datasource.username=__DB_USER__
# spring.datasource.password=__DB_PASSWORD_USE_ENV_VAR__
# kie.flyway.enabled=false
